name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # per pubblicare le release quando si crea un tag v*

jobs:
  macos:
    runs-on: macos-15          # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configura (universal binary arm64 + x86_64)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Compila
        run: cmake --build build --config Release --parallel

      - name: Test del modello
        run: ./build/Release/circuit_test && ./build/Release/click_test

      - name: Test del processore (blocchi, CC MIDI, ON/OFF, stato)
        run: |
          cmake -B build-test -DFTG_BUILD_PLUGIN=OFF -DFTG_BUILD_TESTS=OFF -DFTG_BUILD_PROCESSOR_TEST=ON \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DJUCE_DIR="$PWD/build/_deps/juce-src"
          cmake --build build-test --parallel
          ./build-test/processor_test_artefacts/Release/processor_test

      - name: Firma ad-hoc e pacchetto
        run: |
          A=build/FTG1_artefacts/Release
          mkdir -p "dist/FTG-1"
          cp -R "$A/VST3/FTG-1.vst3" "$A/AU/FTG-1.component" "$A/Standalone/FTG-1.app" "dist/FTG-1/"
          for p in "dist/FTG-1/"*; do codesign --force --deep --sign - "$p"; done
          cp scripts/installa.command "dist/FTG-1/Installa FTG-1.command"
          chmod +x "dist/FTG-1/Installa FTG-1.command"
          cp README.md docs/FTG-1_Manuale.pdf "dist/FTG-1/"
          lipo -info "dist/FTG-1/FTG-1.vst3/Contents/MacOS/FTG-1"
          ls "dist/FTG-1/FTG-1.app/Contents/Resources/"   # deve contenere Icon.icns
          (cd dist && ditto -c -k --keepParent "FTG-1" ../FTG1-macOS.zip)

      - name: Carica l'artefatto
        uses: actions/upload-artifact@v4
        with:
          name: FTG1-macOS
          path: FTG1-macOS.zip

      # Release: con un tag v* oppure, sul ramo main, quando la versione in CMakeLists.txt
      # non ha ancora un tag (si alza la versione, si fa push, la release si crea da sola)
      - name: Pubblica la release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            VER=$(sed -nE 's/^project\(FTG1 VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
            TAG="v$VER"
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "La release $TAG esiste già: niente da fare"; exit 0
            fi
          else
            exit 0
          fi
          NOTES="Build macOS universale (Apple Silicon e Intel): VST3, AU, applicazione autonoma, installatore e manuale d'uso in PDF.

          Installazione: estrai lo zip, togli la quarantena con xattr -dr com.apple.quarantine sulla cartella FTG-1, poi doppio clic su Installa FTG-1.command (vedi il capitolo 3 del manuale)."
          gh release create "$TAG" FTG1-macOS.zip docs/FTG-1_Manuale.pdf \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Collateral Effects FTG-1 $TAG" --notes "$NOTES"
